name: AutoNex CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autonex
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d autonex"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=5

    env:
      NODE_ENV: test
      DATABASE_MIGRATION_URL: postgresql://postgres:postgres@localhost:5432/autonex?schema=public
      DATABASE_URL: postgresql://autonex_app:autonex_app_pass@localhost:5432/autonex?schema=public
      DATABASE_ADMIN_URL: postgresql://autonex_admin:autonex_admin_pass@localhost:5432/autonex?schema=public
      REDIS_URL: redis://localhost:6379
      REDIS_ENABLED: "false"
      SKIP_REDIS_CONNECT: "true"
      JWT_ACCESS_SECRET: ci_access_secret_min_32_characters_long_001
      JWT_REFRESH_SECRET: ci_refresh_secret_min_32_characters_long_002
      QR_SIGNING_SECRET: ci_qr_secret_min_32_characters_long_003
      APP_URL: http://localhost:3000
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1
      S3_STORAGE_DRIVER: local

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile || pnpm install

      - name: Validate & Generate Prisma Client
        run: |
          pnpm db:validate
          pnpm db:generate

      - name: Apply Migrations & RLS Policies
        run: pnpm db:deploy

      - name: Seed Database
        run: pnpm db:seed

      - name: Lint & Typecheck
        run: |
          pnpm lint
          pnpm typecheck

      - name: Unit & Isolation Tests
        run: pnpm test

      - name: PostgreSQL Live RLS Isolation Tests
        run: pnpm --filter @autonex/api test:rls

      - name: Build All Workspaces
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm --filter @autonex/web exec playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        run: pnpm test:e2e
        env:
          CI: "true"

